<text x="28" y="1010" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">3. Verifica rol y relación con paciente antes de operar.</text>
<text x="28" y="1032" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">4. Guarda observaciones y notificaciones por destinatario.</text>
<text x="28" y="1054" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">5. Lee pendientes y actualiza estado de envío.</text>
