<text x="42" y="132" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="42" y="158" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">care_relationships</text>
<text x="42" y="200" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="42" y="223" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">patient_id, doctor_id, status,</text>
<text x="42" y="246" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">authorized_by_user_id</text>
<text x="42" y="269" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">invited_at, expires_at, accepted_at, ended_at:</text>
<text x="42" y="292" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">temporal</text>
<text x="42" y="315" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">version BIGINT</text>
<rect x="563" y="110" width="459" height="128" rx="9" fill="#f4f8fb" stroke="#235b82" stroke-width="1.5"/>
<rect x="563" y="110" width="459" height="67" rx="9" fill="#235b82"/>
<text x="577" y="132" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="577" y="158" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">caregiver_profiles</text>
<text x="577" y="200" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="577" y="223" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">name, phone y email VARCHAR(255)</text>
<rect x="28" y="398" width="459" height="174" rx="9" fill="#f4f8fb" stroke="#235b82" stroke-width="1.5"/>
<rect x="28" y="398" width="459" height="67" rx="9" fill="#235b82"/>
<text x="42" y="420" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="42" y="446" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">doctor_observations</text>
<text x="42" y="488" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="42" y="511" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">patient_id, doctor_id, doctor_name</text>
<text x="42" y="534" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">text VARCHAR(2000) NOT NULL</text>
<text x="42" y="557" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">created_at, attended_at: temporal</text>
<rect x="563" y="398" width="459" height="220" rx="9" fill="#f4f8fb" stroke="#235b82" stroke-width="1.5"/>
<rect x="563" y="398" width="459" height="67" rx="9" fill="#235b82"/>
<text x="577" y="420" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="577" y="446" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">observation_notifications</text>
<text x="577" y="488" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="577" y="511" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">recipient_id, observation_id, patient_id,</text>
<text x="577" y="534" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">doctor_name</text>
<text x="577" y="557" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">created_at, read_at: temporal</text>
<text x="577" y="580" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">email_status VARCHAR(255); email_attempts</text>
<text x="577" y="603" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">INTEGER</text>
<text x="28" y="664" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">1. observation_id lógico: una observación puede producir 0..* avisos.</text>
<text x="28" y="686" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">Repositorios gestionan referencias por ID; la inspección no acredita restricciones físicas de producción.</text>
</svg>
