<text x="42" y="132" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="42" y="158" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">users</text>
<text x="42" y="200" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="42" y="223" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">email VARCHAR(255) NN UQ</text>
<text x="42" y="246" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">name, password_hash NN; role NN</text>
<text x="42" y="269" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">phone VARCHAR(255)</text>
<rect x="563" y="110" width="459" height="151" rx="9" fill="#f4f8fb" stroke="#235b82" stroke-width="1.5"/>
<rect x="563" y="110" width="459" height="67" rx="9" fill="#235b82"/>
<text x="577" y="132" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="577" y="158" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">auth_sessions</text>
<text x="577" y="200" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(64)</text>
<text x="577" y="223" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">user_id VARCHAR(255) NN</text>
<text x="577" y="246" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">expires_at temporal NN</text>
