<text x="577" y="374" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="577" y="400" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">doctors</text>
<text x="577" y="442" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="577" y="465" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">professional_license VARCHAR(255) NN UQ</text>
<text x="577" y="488" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">name, specialty, practice_type, clinic_id,</text>
<text x="577" y="511" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">verification_status</text>
<rect x="563" y="594" width="459" height="128" rx="9" fill="#f4f8fb" stroke="#235b82" stroke-width="1.5"/>
<rect x="563" y="594" width="459" height="67" rx="9" fill="#235b82"/>
<text x="577" y="616" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="577" y="642" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">clinics</text>
<text x="577" y="684" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="577" y="707" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">name VARCHAR(255) NN</text>
<text x="28" y="768" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">1. Referencia lógica: users 1 a 0..* auth_sessions.</text>
<text x="28" y="790" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">2. Referencia lógica: 0..* alias para un usuario.</text>
<text x="28" y="812" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">3. clinic_id lógico: 0..1 clínica por médico.</text>
<text x="28" y="834" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">NN = NOT NULL. UQ = UNIQUE. Las líneas discontinuas indican identificadores, no claves foráneas JPA.</text>
</svg>
