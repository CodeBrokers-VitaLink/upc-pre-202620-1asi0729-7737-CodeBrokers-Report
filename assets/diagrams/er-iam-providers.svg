<text x="42" y="400" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">login_aliases</text>
<text x="42" y="442" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="42" y="465" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">user_id, password_hash VARCHAR(255) NN</text>
<rect x="563" y="352" width="459" height="174" rx="9" fill="#f4f8fb" stroke="#235b82" stroke-width="1.5"/>
