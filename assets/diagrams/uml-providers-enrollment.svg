<text x="577" y="642" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">EnrollmentCatalog</text>
<text x="577" y="684" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">Puerto de lectura de los proveedores.</text>
<text x="28" y="745" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">1. clinicId lógico; un médico tiene 0..1 clínica.</text>
<text x="28" y="767" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">2. La solicitud de alta incluye una captura de signos simulados.</text>
<text x="28" y="789" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">Enrollment también utiliza FamilyAccountRegistration para registrar la cuenta IAM.</text>
