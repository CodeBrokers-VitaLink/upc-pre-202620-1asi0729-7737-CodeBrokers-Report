<text x="577" y="524" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">CLASE DE DOMINIO</text>
<text x="577" y="550" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">EnrollmentStore</text>
<text x="577" y="592" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">Orquesta catálogos y solicitudes de alta por</text>
<text x="577" y="615" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">EnrollmentPort.</text>
<text x="28" y="676" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">1. Login usa el estado y los comandos de sesión.</text>
<text x="28" y="698" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">2. CareWorkspace consulta el estado y cambia alertas mediante el store.</text>
<text x="28" y="720" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">3. El formulario usa el store de alta.</text>
<text x="28" y="742" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">Los servicios HTTP adaptan DTO REST a modelos Angular. La Landing Page usa funciones JavaScript, sin modelo de clases</text>
<text x="28" y="764" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">propio.</text>
