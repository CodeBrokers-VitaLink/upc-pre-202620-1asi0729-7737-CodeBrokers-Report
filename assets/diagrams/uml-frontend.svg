<text x="577" y="354" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">CareStore</text>
<text x="577" y="396" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">Estado de pacientes, mediciones, alertas e</text>
