<text x="754" y="715" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">Enrollment</text>
<text x="754" y="757" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">ACL y JPA</text>
<text x="754" y="780" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">Conectan alta con IAM,</text>
<text x="754" y="803" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">Providers y Care.</text>
<text x="28" y="864" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">1. Valida solicitudes; el filtro bearer protege recursos privados.</text>
<text x="28" y="886" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">2. Consulta recursos de proveedores.</text>
<text x="28" y="908" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">3. Transforma el resource en un comando.</text>
<text x="28" y="930" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">4. Lee y escribe identidades y sesiones; aplica BCrypt.</text>
<text x="28" y="952" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">5. Consulta repositorios y el registro ficticio.</text>
<text x="28" y="974" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">6. Invoca FamilyAccountRegistration, EnrollmentCatalog y FamilyPatientRepository.</text>
