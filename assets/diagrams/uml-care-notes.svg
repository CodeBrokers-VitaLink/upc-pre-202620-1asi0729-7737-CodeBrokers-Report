<text x="577" y="397" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">CLASE DE DOMINIO</text>
<text x="577" y="423" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">ObservationNotification</text>
<text x="577" y="465" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">- observationId / recipientId: String</text>
<text x="577" y="488" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">- emailAttempts: int</text>
<text x="577" y="511" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">+ belongsTo(userId): boolean</text>
<text x="577" y="534" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">+ read(): void</text>
<text x="577" y="557" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">+ emailAttempt(success): void</text>
<text x="28" y="618" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">1. Una observación origina 0..* avisos según los destinatarios.</text>
<text x="28" y="640" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">CareRelationship vincula a paciente y médico por identificadores. ObservationEmailSender se implementa mediante</text>
<text x="28" y="662" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">Resend.</text>
