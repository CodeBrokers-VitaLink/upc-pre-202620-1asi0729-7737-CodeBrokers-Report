<text x="42" y="158" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">CareRelationship</text>
<text x="42" y="200" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">- patientId / doctorId: String</text>
