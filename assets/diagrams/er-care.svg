<text x="42" y="132" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">TABLA INFERIDA</text>
<text x="42" y="158" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">patients</text>
<text x="42" y="200" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">PK id VARCHAR(255)</text>
<text x="42" y="223" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">given_name, family_name, family_display_name</text>
<text x="42" y="246" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">age INTEGER; version BIGINT</text>
<text x="42" y="269" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">location, provider_id, user_id</text>
<rect x="563" y="110" width="459" height="151" rx="9" fill="#f4f8fb" stroke="#235b82" stroke-width="1.5"/>
