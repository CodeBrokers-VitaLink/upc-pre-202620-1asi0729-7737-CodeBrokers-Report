<text x="42" y="881" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#e8f2fb">ENUMERACIÓN</text>
<text x="42" y="907" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#ffffff">Severity</text>
<text x="42" y="949" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">HIGH</text>
<text x="42" y="972" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">MEDIUM</text>
<text x="42" y="995" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#17324a">LOW</text>
<text x="28" y="1056" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">1. patientId lógico; un paciente puede tener 0..* mediciones.</text>
<text x="28" y="1078" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">2. patientId lógico; un paciente puede tener 0..* alertas.</text>
<text x="28" y="1100" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">3. alertId lógico; una alerta tiene 0..* intervenciones.</text>
<text x="28" y="1122" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#17324a">4. Cada alerta tiene un estado. Severity clasifica las alertas en su propio enum.</text>
